name: DLP & Anonymity Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dlp-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for PII, personal domains, and credentials
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          PATTERNS = [
              (r'\bghp_[A-Za-z0-9]{20,}\b', 'GitHub PAT'),
              (r'\bsk-[A-Za-z0-9]{20,}\b', 'API secret key'),
              (r'UNIFI_API_KEY=(?!your_)[A-Za-z0-9_-]{15,}', 'Hardcoded UniFi API Key'),
              (r'heselmans|kruisstraat|bomma|tuinbouwstraat|tessenderlo|duffel|meeus|vinosnap', 'Personal/internal identifier'),
              (r'heselmans@gmail\.com|kristof@', 'Personal email'),
          ]

          violations = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.name == 'dlp-guard.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for pattern, label in PATTERNS:
                      if re.search(pattern, line, re.IGNORECASE):
                          violations.append(f"{path}:{lineno}: [{label}]")

          if violations:
              print("❌ DLP VIOLATIONS DETECTED:")
              for v in violations:
                  print("  -", v)
              sys.exit(1)
          print("✅ DLP Guard passed: zero PII or secret patterns found.")
          EOF
